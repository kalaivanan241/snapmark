[package]
name = "snapmark"
version = "0.1.0"
edition = "2021"
description = "Screenshot & markup for macOS"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
chrono = "0.4"
dirs = "6"
objc2 = "0.6"
objc2-foundation = "0.3"
core-foundation = "0.10"

[features]
# Serve the bundled `ui/` folder (no dev server). Kept on by default so plain
# `cargo run` / `cargo build --release` work without the Tauri CLI.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"

# PNG decode/encode is painfully slow unoptimised; keep debug builds usable.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
